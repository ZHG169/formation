formation_node:
  ros__parameters:
    control_frequency: 100.0
    control_mode: centralized

    leader_id: 1

    formation_type: triangle
    formation_spacing: 2.0 #與目標點距離 若無人機之間距離太大這個要縮小
    takeoff_height: 3.0

    # 地面端產生的虛擬編隊中心，使用共同 World ENU。
    # 編隊 setpoint 不會使用 Leader 的實際位置作為基準。
    formation_reference_enu: [4.0, 0.0, 3.0]
    formation_reference_yaw_enu: 0.0
    command_timeout: 1.0

    # Control Potential Field avoidance.
    # CPF uses real-time UAV positions to modify setpoints, but it does
    # not use a pre-written path such as forward 100 m then left 100 m.
    cpf_enabled: true
    cpf_attraction_gain: 0.5  #往編隊目標靠近的推力
    cpf_repulsion_gain: 1.2 #避免碰撞的推力
    cpf_safe_distance: 1.5 #安全距離，若小於此距離則會產生排斥力
    cpf_influence_distance: 3.0 #影響距離，若小於此距離則會產生排斥力，若大於此距離則不會產生排斥力
    cpf_max_speed: 0.6 #最大速度，若超過此速度則會限制速度
    cpf_output_velocity: true 

    ready_hold_duration: 2.0
    offboard_warmup_duration: 2.0
    local_position_timeout: 2.0
    takeoff_altitude_tolerance: 0.3

    leader_position_timeout: 2.0
    leader_failure_hold_duration: 1.0
    land_command_interval: 1.0

    # 每架 PX4 local ENU 原點在共同 Gazebo world ENU 中的位置。
    # 順序必須與 vehicle_system_ids 相同，每架依序為 east/north/up。
    vehicle_origins_enu: [
      0.0, 0.0, 0.0,
      2.0, 0.0, 0.0,
      0.0, 2.0, 0.0
    ]

    #safety 參數
    minimum_vehicle_distance: 0.8 #安全距離 若低於會迫使無人機降落
    maximum_altitude: 20.0 #最大高度
    maximum_speed: 3.0  #最大速度
    geofence_radius: 50.0 #地理圍欄半徑

    #maximum_setpoint_jump作為第二個安全判斷 第一個為CPF採用的最大速度
    maximum_setpoint_jump: 6.0  #最大setpoint跳躍距離，若無人機位與目標位子差異太遠會觸發 避免出問題
    formation_position_tolerance: 0.5

    vehicle_names:
      - MAV1
      - MAV2
      - MAV3

    vehicle_system_ids:
      - 1
      - 2
      - 3

#leader 發布頻率
leader_command_node:
  ros__parameters:
    publish_frequency: 20.0

# Distributed mode: each node computes only its own setpoint from
# /formation/command plus its own local PX4 state. It does not subscribe
# to the leader vehicle position.
# 只有在切換到分散模式才會使用下面程式碼
distributed_vehicle_1:
  ros__parameters:
    control_frequency: 100.0
    vehicle_id: 1
    namespace: MAV1
    vehicle_origin_enu: [0.0, 0.0, 0.0]
    vehicle_ids: [1, 2, 3]
    vehicle_names: [MAV1, MAV2, MAV3]
    vehicle_origins_enu: [
      0.0, 0.0, 0.0,
      2.0, 0.0, 0.0,
      0.0, 2.0, 0.0
    ]
    formation_type: line
    formation_spacing: 4.0
    formation_reference_enu: [4.0, 0.0, 3.0]
    formation_reference_yaw_enu: 0.0
    command_timeout: 1.0
    local_position_timeout: 2.0
    cpf_enabled: true
    cpf_attraction_gain: 0.8
    cpf_repulsion_gain: 1.2
    cpf_safe_distance: 1.5
    cpf_influence_distance: 4.0
    cpf_max_speed: 0.8
    cpf_output_velocity: true

