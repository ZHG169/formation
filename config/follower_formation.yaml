follower_formation_node:
  ros__parameters:
    control_frequency: 50.0
    leader_id: 1

    formation_type: column
    formation_spacing: 1.2
    formation_reference_yaw_enu: 0.0
    formation_position_tolerance: 0.5
    formation_speed_tolerance: 0.15
    formation_hold_duration: 2.0
    local_position_timeout: 2.0
    yaw_debug_enabled: false
    yaw_debug_interval: 1.0
    target_debug_enabled: true
    target_debug_interval: 1.0
    slot_assignment_lock: true
    tracking_kp: 0.8
    tracking_max_speed: 0.5
    tracking_deadband: 0.03
    leader_velocity_feedforward: false

    vehicle_names:
      - MAV1
      - MAV2
      - MAV3

    vehicle_system_ids:
      - 1
      - 2
      - 3

    vehicle_origins_enu: [
      0.0, 0.0, 0.0,
      2.0, 0.0, 0.0,
      0.0, 2.0, 0.0
    ]

    cpf_enabled: true
    cpf_attraction_gain: 0.5
    cpf_repulsion_gain: 1.2
    cpf_safe_distance: 0.8
    cpf_influence_distance: 3.0
    cpf_max_speed: 0.6
    cpf_output_velocity: true


    # Rectangular world fence in ROS ENU frame.
    fence_enabled: false
    fence_world_x_min: -1.7
    fence_world_x_max: 1.7
    fence_world_y_min: -1.5
    fence_world_y_max: 1.5
    fence_height_min: 0.0
    fence_height_max: 1.4
    fence_brake_distance_m: 0.35

